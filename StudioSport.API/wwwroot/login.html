<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudioSport — התחברות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">

      <a href="index.html" class="brand" style="display:block;text-decoration:none;color:var(--white);margin-bottom:6px;font-size:22px">
        Studio<span>Sport</span>
      </a>
      <p class="hint" id="authHint">התחברי כדי לראות את השיעורים שלך</p>

      <div id="authAlert" class="alert"></div>

      <form id="loginForm">
        <div class="field">
          <label for="loginUser">שם משתמש</label>
          <input type="text" id="loginUser" placeholder="ruthi" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPass">סיסמה</label>
          <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">התחברות</button>
        </div>
      </form>

      <form id="registerForm" style="display:none">
        <div class="field">
          <label for="regUser">שם משתמש</label>
          <input type="text" id="regUser" placeholder="בחרי שם משתמש" required>
        </div>
        <div class="field">
          <label for="regEmail">דוא"ל</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="regPass">סיסמה</label>
          <input type="password" id="regPass" placeholder="לפחות 6 תווים" minlength="6" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">יצירת חשבון</button>
        </div>
      </form>

      <p class="switch-line">
        <span id="switchText">אין לך חשבון?</span>
        <a id="switchLink">הרשמה</a>
      </p>

      <p class="switch-line" style="margin-top:10px">
        <a href="index.html">חזרה לדף הבית</a>
      </p>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (getToken()) window.location.href = "classes.html";

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const switchLink = document.getElementById("switchLink");
    const switchText = document.getElementById("switchText");
    const authHint = document.getElementById("authHint");

    let isLogin = true;

    switchLink.addEventListener("click", () => {
      isLogin = !isLogin;
      loginForm.style.display = isLogin ? "block" : "none";
      registerForm.style.display = isLogin ? "none" : "block";
      switchText.textContent = isLogin ? "אין לך חשבון?" : "כבר יש לך חשבון?";
      switchLink.textContent = isLogin ? "הרשמה" : "התחברות";
      authHint.textContent = isLogin
        ? "התחברי כדי לראות את השיעורים שלך"
        : "פתיחת חשבון חדש בסטודיו";
      hideAlert("authAlert");
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert("authAlert");

      const username = document.getElementById("loginUser").value.trim();
      const password = document.getElementById("loginPass").value;

      try {
        const res = await Api.login(username, password);
        if (!res.ok) {
          showAlert("authAlert", res.data?.message || "שם משתמש או סיסמה שגויים", "error");
          return;
        }
        saveSession(res.data.token, {
          username: res.data.username || username,
          role: res.data.role
        });
        window.location.href = "classes.html";
      } catch (err) {
        showAlert("authAlert", "לא ניתן להתחבר לשרת. ודאי שהוא פועל.", "error");
      }
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert("authAlert");

      const username = document.getElementById("regUser").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPass").value;

      try {
        const res = await Api.register(username, password, email);
        if (!res.ok) {
          showAlert("authAlert", res.data?.message || "לא ניתן לפתוח חשבון", "error");
          return;
        }
        showAlert("authAlert", "החשבון נוצר. מתחברת...", "success");
        const login = await Api.login(username, password);
        if (login.ok) {
          saveSession(login.data.token, {
            username: login.data.username || username,
            role: login.data.role
          });
          window.location.href = "classes.html";
        }
      } catch (err) {
        showAlert("authAlert", "לא ניתן להתחבר לשרת. ודאי שהוא פועל.", "error");
      }
    });
  </script>
</body>
</html>

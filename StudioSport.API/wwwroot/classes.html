<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudioSport — שיעורים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <a href="#main" class="skip-link">דלג לתוכן הראשי</a>

  <header class="topbar">
    <div class="brand">Studio<span>Sport</span></div>
    <div class="user-area">
      <a href="admin-classes.html" id="navAdminClasses" class="btn btn-ghost"
   style="padding:8px 18px;font-size:14px;display:none">ניהול שיעורים</a>
      <a href="admin.html" id="adminLink" class="btn btn-ghost"
        style="padding:8px 18px;font-size:14px;display:none">ניהול מנויים</a>
      <a href="my-classes.html" id="navMyClasses" class="btn btn-ghost" style="padding:8px 18px;font-size:14px">השיעורים שלי</a>
<a href="subscribe.html" id="navMySubscription" class="btn btn-ghost" style="padding:8px 18px;font-size:14px">המנוי שלי</a>
      <span id="userName"></span>
      <div class="avatar" id="userAvatar"></div>
      <button class="btn btn-ghost" style="padding:8px 18px;font-size:14px" onclick="logout()">יציאה</button>
    </div>
  </header>

  <main class="page" id="main" tabindex="-1">
    <h1 class="page-title">שיעורים זמינים</h1>
    <p class="page-sub">בחרי שיעור והירשמי. המקומות מוגבלים.</p>

    <div id="pageAlert" class="alert"></div>

    <div class="stats" id="statsRow">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-label">שיעורים פתוחים</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statFree">—</div>
        <div class="stat-label">מקומות פנויים</div>
        <div class="stat-spark" id="sparkFree"></div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statMine">—</div>
        <div class="stat-label">ההרשמות שלי</div>
        <div class="stat-spark" id="sparkMine"></div>
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>שיעור</th>
            <th>מדריכה</th>
            <th>מועד</th>
            <th>מקומות</th>
            <th>סטטוס</th>
            <th scope="col"><span class="visually-hidden">פעולות</span></th>
          </tr>
        </thead>
        <tbody id="classesBody">
          <tr>
            <td colspan="6" class="empty-state">טוען...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- חלונית "מה להצטייד" -->
  <div class="modal-backdrop" id="gearModal">
    <div class="modal">
      <h2>נרשמת בהצלחה</h2>
      <p id="gearClassInfo"></p>
      <ul class="check-list" id="gearList"></ul>
      <button class="btn btn-primary" style="width:100%" onclick="closeGear()">הבנתי</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth();
    renderUserArea();
    const _u = getUser();
    if (_u && _u.role === 'Admin') {
  document.getElementById('adminLink').style.display = '';
  document.getElementById('navAdminClasses').style.display = 'inline-flex';
      document.getElementById('navMyClasses').style.display = 'none';
      document.getElementById('navMySubscription').style.display = 'none';
}
    let currentClasses = [];

    /* ---------- נרמול תשובות מהשרת ---------- */

    // השרת עשוי להחזיר מערך ישירות, או עטיפה: { items: [...] } / { data: [...] }
    function asArray(payload) {
      if (Array.isArray(payload)) return payload;
      if (payload && Array.isArray(payload.items)) return payload.items;
      if (payload && Array.isArray(payload.data)) return payload.data;
      return [];
    }

    // ה-enum נשלח כמחרוזת ("Active") או כמספר (0)
    function isActiveStatus(status) {
      return status === "Active" || status === 0;
    }

    // שם השדה עשוי להיות classId או classSessionId
    function enrollmentClassId(e) {
      return e.classId ?? e.classSessionId ?? e.classSession?.id ?? null;
    }

    async function loadPage() {
      hideAlert("pageAlert");

      let classesRes, mineRes, statsRes;

      try {
        [classesRes, mineRes, statsRes] = await Promise.all([
          Api.getClasses(),
          Api.getMyEnrollments(),
          Api.getStats()
        ]);
      } catch (err) {
        console.error(err);
        showAlert("pageAlert", "לא ניתן להתחבר לשרת. ודאי שהוא פועל.", "error");
        renderClasses(new Set());
        return;
      }

      if (!classesRes.ok) {
        showAlert("pageAlert", "לא ניתן לטעון שיעורים", "error");
        renderClasses(new Set());
        return;
      }

      const now = new Date();

      // רק שיעורים שטרם התקיימו
      currentClasses = asArray(classesRes.data)
        .filter(c => new Date(c.startTime) > now);

      const mine = mineRes.ok && mineRes.data
        ? [...(mineRes.data.active || []), ...(mineRes.data.history || [])]
        : [];
      // שיעורים פתוחים — לא מבוטלים
      const openClasses = currentClasses.filter(c => !c.isCancelled);
      const cancelledIds = new Set(
        currentClasses.filter(c => c.isCancelled).map(c => c.id)
      );

      // ההרשמות הפעילות שלי, בלי אלו ששייכות לשיעור מבוטל
      // ההרשמות הפעילות שלי, בלי אלו ששייכות לשיעור מבוטל
      const myList = (mineRes.ok && (mineRes.data?.active ?? mineRes.data?.Active)) || [];

      const activeMine = myList.filter(e => {
        const st = e.status ?? e.Status;
        const cid = e.classId ?? e.ClassId;
        return st === "Active" && !cancelledIds.has(cid);
      });

      // שני הכרטיסים הראשונים — מהשרת
      if (statsRes.ok && statsRes.data) {
        document.getElementById("statTotal").textContent = statsRes.data.total ?? "—";
        document.getElementById("statFree").textContent = statsRes.data.free ?? "—";
      }

      // הכרטיס האישי — מההרשמות שלי
      document.getElementById("statMine").textContent = activeMine.length;

      const mineIds = new Set(activeMine.map(e => e.classId ?? e.ClassId));

      // הכרטיס האישי — מההרשמות שלי

      drawSpark("sparkFree", openClasses.map(c => c.availableSpots || 0));
      drawSpark("sparkMine", openClasses.map(c => (mineIds.has(c.id) ? 1 : 0)));

      renderClasses(mineIds);
    }

    /* ---------- מיני-גרף עמודות ---------- */
    function drawSpark(id, values) {
      const el = document.getElementById(id);
      if (!el) return;
      if (!values.length) { el.innerHTML = ""; return; }

      const max = Math.max(...values, 1);
      el.innerHTML = values.map(v => {
        const h = Math.round((v / max) * 100);
        return `<span class="${v === 0 ? "is-low" : ""}" style="height:${Math.max(h, 8)}%" title="${v}"></span>`;
      }).join("");
    }

    /* ---------- אייקוני ציוד ---------- */
    const GEAR_ICONS = {
      towel: '<svg viewBox="0 0 24 24"><path d="M4 7h13a3 3 0 0 1 3 3v7"/><path d="M4 7v10a2 2 0 0 0 2 2h9"/><path d="M8 7v12"/></svg>',
      water: '<svg viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v3l-1.5 3A3 3 0 0 0 8.4 12v7a2 2 0 0 0 2 2h3.2a2 2 0 0 0 2-2v-7a3 3 0 0 0-.1-1.9L14 6V3"/><path d="M8.5 14h7"/></svg>',
      mat: '<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M7 8v8"/><path d="M11 8v8"/><path d="M15 8v8"/></svg>',
      shoes: '<svg viewBox="0 0 24 24"><path d="M3 16V9h4l3 3h4a5 5 0 0 1 5 5v1H3z"/><path d="M6 12h2"/></svg>',
      rope: '<svg viewBox="0 0 24 24"><path d="M8 5c-3 3-3 11 0 14"/><path d="M16 5c3 3 3 11 0 14"/><circle cx="8" cy="5" r="1.6"/><circle cx="16" cy="5" r="1.6"/></svg>',
      fallback: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>'
    };

    function gearIcon(text) {
      const t = String(text);
      if (/מגבת/.test(t)) return GEAR_ICONS.towel;
      if (/מים|בקבוק/.test(t)) return GEAR_ICONS.water;
      if (/מזרן|מזרון/.test(t)) return GEAR_ICONS.mat;
      if (/נעל/.test(t)) return GEAR_ICONS.shoes;
      if (/חבל|קפיצ/.test(t)) return GEAR_ICONS.rope;
      return GEAR_ICONS.fallback;
    }
    function renderClasses(enrolledClassIds = new Set()) {
      const body = document.getElementById("classesBody");

      if (!currentClasses.length) {
        body.innerHTML =
          '<tr><td colspan="6" class="empty-state">אין שיעורים זמינים כרגע</td></tr>';
        return;
      }

      body.innerHTML = currentClasses.map(c => {
        const enrolled = enrolledClassIds.has(c.id);
        const full = ((c.capacity ?? 0) - (c.enrolledCount ?? 0)) <= 0;
        const cancelled = c.isCancelled;

        let badge, action;

        if (cancelled) {
          badge = '<span class="badge badge-muted">בוטל</span>';
          action = "";
        } else if (enrolled) {
          badge = '<span class="badge badge-free">רשומה</span>';
          action = '<button class="btn btn-ghost" disabled style="font-size:14px;padding:9px 18px">רשומה</button>';
        } else if (full) {
          badge = '<span class="badge badge-full">מלא</span>';
          action = '<button class="btn btn-ghost" disabled style="font-size:14px;padding:9px 18px">מלא</button>';
        } else {
          badge = `<span class="badge badge-free">${c.availableSpots} פנויים</span>`;
          // aria-label כולל את שם השיעור ואת מועדו — קורא מסך יידע על מה לוחצים
          const label = escapeHtml(`${c.name}, ${c.availableSpots} מקומות פנויים`);
          action = `<button class="btn btn-primary" style="font-size:14px;padding:9px 20px"
                     aria-label="הרשמה: ${label}"
                     onclick="enroll(${c.id}, this)">הירשמות</button>`;
        }

        return `
          <tr>
            <td>
              <span class="class-name">${escapeHtml(c.name)}</span>
              <span class="class-note">${escapeHtml(c.equipmentNotes || "")}</span>
            </td>
            <td>${escapeHtml(c.trainerName || "")}</td>
            <td>${formatDate(c.startTime)}</td>
            <td>${c.enrolledCount} / ${c.capacity}</td>
            <td>${badge}</td>
        <td style="text-align:left">${action}</td>                    </tr>`;
      }).join("");
    }

    async function enroll(classId, btn) {
      if (btn) {
        btn.disabled = true;
        btn.textContent = "נרשמת...";
      }

      let res;
      try {
        res = await Api.enroll(classId);
      } catch (err) {
        console.error(err);
        showAlert("pageAlert", "לא ניתן להתחבר לשרת. ודאי שהוא פועל.", "error");
        if (btn) { btn.disabled = false; btn.textContent = "הירשמות"; }
        return;
      }

      if (res.ok) {
        await loadPage();
        showAlert("pageAlert", "ההרשמה בוצעה בהצלחה.", "success");

        const cls = currentClasses.find(c => c.id === classId);
        if (cls) openGear({
          name: cls.name,
          startTime: cls.startTime,
          equipmentNotes: cls.equipmentNotes
        });

        return;
      }

      if (btn) { btn.disabled = false; btn.textContent = "הירשמות"; }

      // 409 = התנגשות. ההודעה מגיעה מהשרת כי יש כמה סוגים:
      // מקום שנתפס, כבר רשומה, מכסה יומית — וכולם שונים.
      if (res.status === 409) {
        showAlert("pageAlert", res.data?.message || "לא ניתן להשלים את הרישום כרגע. נסי שוב.", "error");
        await loadPage();
        return;
      }

      // 403 = אין מנוי פעיל
      if (res.status === 403) {
        showAlert("pageAlert", "נדרש מנוי פעיל כדי להירשם לשיעור. ניתן לחדש את המנוי.", "error");
        return;
      }
      showAlert("pageAlert", res.data?.message || "לא ניתן להירשם לשיעור.", "error");
    }
    function openGear(cls) {
      document.getElementById("gearClassInfo").textContent =
        cls ? `${cls.name} · ${formatDate(cls.startTime)}` : "";
      const list = document.getElementById("gearList");
      const notes = cls && cls.equipmentNotes ? cls.equipmentNotes : "אין ציוד מיוחד";
      list.innerHTML = notes.split(/[,،]/).map(n =>
        `<li>${gearIcon(n)}<span>${escapeHtml(n.trim())}</span></li>`
      ).join("");
      document.getElementById("gearModal").classList.add("open");
    }

    function closeGear() {
      document.getElementById("gearModal").classList.remove("open");
    }

    loadPage();
  </script>
</body>

</html>
